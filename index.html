<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bem-vindo • Sistema de Operações</title>

  <!-- seu CSS global -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg);">
    <div style="width:100%; max-width:980px; padding:40px; box-sizing:border-box;">
      <div style="background:var(--card); border-radius:14px; padding:40px; box-shadow:0 12px 40px rgba(16,24,40,0.06); text-align:center;">
        <!-- TÍTULO GRANDE -->
        <h1 id="mainTitle" style="margin:0 0 18px 0; font-size:86px; line-height:0.95; font-weight:900; color:var(--accent);">
          <span id="typingArea" aria-hidden="true"></span><span id="cursor" class="cursor" aria-hidden="true"></span>
        </h1>

        <!-- subtítulo sucinto (opcional, pequeno) -->
        <p style="margin:0 0 26px 0; color:var(--muted); font-size:1.05rem;">
          Painel de operações — dias úteis e cálculos financeiros
        </p>

        <!-- BOTÕES CENTRALIZADOS -->
        <div style="display:flex; gap:12px; justify-content:center; align-items:center; margin-bottom:18px; flex-wrap:wrap;">
          <a id="novaOpBtn" class="btn" href="dados.html" style="min-width:220px; padding:12px 18px; font-size:1.05rem;">➕ Nova operação</a>
          <a id="histBtn" class="btn secondary" href="historico.html" style="min-width:260px; padding:12px 18px; font-size:1.05rem; text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">
            📚 Histórico de clientes
          </a>
        </div>

        <!-- badge de modo (se quiser mostrar) -->
        <div style="margin:0 auto 18px auto; display:inline-block;">
          <div id="modeBadge" class="mode-badge" style="font-weight:700; padding:8px 12px; border-radius:999px; background:rgba(19,102,214,0.08); color:var(--accent);">Modo: Desconto</div>
        </div>

        <!-- Observação mínima (opcional) -->
        <p style="margin-top:18px; color:var(--muted); font-size:0.95rem;">
          © <span id="ano"></span> Sistema
        </p>
      </div>
    </div>
  </main>

  <!-- seu JS da home -->
  <script src="home.js" defer></script>
</body>
</html>
